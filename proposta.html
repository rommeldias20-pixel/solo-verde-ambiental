<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Proposta Comercial · Solo Verde Ambiental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@300..700&display=swap">
<style>
/* Layout: capa escura (Mata Fechada) onde o jato de hidrossemeadura cobre o talude; depois um dossiê claro sobre Orvalho, seções numeradas na ordem real da obra. */
:root{
  --orvalho:#E5FAE7; --mata:#2B443B; --mata-2:#3C574C; --mata-3:#1F332C; --talude:#9AB06A; --rebrota:#96F456; --algodao:#FFFFFF; --terra:#C9B58F; --terra-d:#8B7350;
  --linha:rgba(43,68,59,.14); --linha-forte:rgba(43,68,59,.28);
  --serif:'Lora', Georgia, 'Times New Roman', serif;
  --sans:'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  --leaf-d:#2B443B; --leaf-l:#9AB06A; --word:#2B443B;
  --wrap:1120px; --gutter:clamp(16px,4vw,40px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--orvalho);color:var(--mata);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
img,video,canvas,svg{max-width:100%}
:focus-visible{outline:2px solid var(--rebrota);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.eyebrow .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rebrota);margin-right:10px;vertical-align:1px;box-shadow:0 0 0 3px rgba(150,244,86,.25)}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font:600 14px/1 var(--sans);letter-spacing:.02em;text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .2s ease, box-shadow .2s ease, background .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-lime{background:var(--rebrota);color:var(--mata)}
.btn-lime:hover{box-shadow:0 10px 24px rgba(110,190,50,.35)}
.btn-dark{background:var(--mata);color:var(--orvalho)}
.btn-dark:hover{box-shadow:0 10px 24px rgba(43,68,59,.25)}
.btn-ghost{border-color:var(--linha-forte);color:var(--mata);background:transparent}
.btn-ghost:hover{background:var(--algodao)}
.btn-ghost-l{border-color:rgba(229,250,231,.35);color:var(--orvalho);background:transparent}
.btn-ghost-l:hover{background:rgba(229,250,231,.08)}

/* aviso de exemplo */
.demo{background:var(--rebrota);color:var(--mata);font-size:13px;font-weight:600;text-align:center;padding:9px 16px}

/* capa */
.cover{position:relative;background:var(--mata);color:var(--orvalho);overflow:hidden;isolation:isolate}
.cover canvas{position:absolute;inset:auto 0 0 0;width:100%;height:clamp(170px,22vw,280px);z-index:-1;display:block}
.cover .grain{position:absolute;inset:0;z-index:-2;background:radial-gradient(1200px 600px at 85% -10%, rgba(150,244,86,.10), transparent 60%),radial-gradient(800px 500px at 0% 0%, rgba(154,176,106,.12), transparent 60%)}
.cover-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:26px}
.cover .logo-h{--leaf-d:#E5FAE7;--leaf-l:#9AB06A;--word:#E5FAE7;height:46px;width:177px;display:block}
.cover-meta{text-align:right;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;line-height:1.7}
.cover-meta b{display:block;font-family:var(--serif);font-size:18px;letter-spacing:0;text-transform:none;font-weight:500;opacity:1;color:var(--rebrota)}
.cover-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(24px,5vw,72px);align-items:end;padding-block:clamp(20px,4vw,44px) clamp(96px,10vw,130px)}
.cover h1{font-size:clamp(38px,5.6vw,74px);line-height:1.02;letter-spacing:-.02em;margin-block:20px 24px}
.cover h1 em{font-style:italic;color:var(--rebrota)}
.cover .for{font-size:clamp(15px,1.3vw,17px);opacity:.88;max-width:46ch}
.cover .for strong{font-weight:600;opacity:1}
.cover .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.frame{position:relative;justify-self:end;width:100%;max-width:340px;border-radius:22px;overflow:hidden;aspect-ratio:4/5;background:var(--mata-3);box-shadow:0 30px 60px rgba(0,0,0,.28)}
.frame video,.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .tag{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(31,51,44,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12px}
.frame .tag b{font-family:var(--serif);font-size:15px;font-weight:500}
@media (max-width:820px){.cover-grid{grid-template-columns:minmax(0,1fr)}.frame{justify-self:start;aspect-ratio:5/4}.cover-meta{display:none}}

/* load sequence */
.ld{opacity:1;transform:none}
.js .ld{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + 150ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* barra fixa */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(229,250,231,.9);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--linha)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.bar .id{display:flex;align-items:center;gap:12px;min-width:0;font-size:13px}
.bar .id svg{width:30px;height:30px;flex-shrink:0}
.bar .id span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .id b{font-weight:600}
.bar nav{display:flex;gap:22px;font-size:13px;font-weight:500}
.bar nav a{text-decoration:none;opacity:.8}
.bar nav a:hover{opacity:1;text-decoration:underline;text-decoration-color:var(--rebrota);text-decoration-thickness:2px;text-underline-offset:6px}
.bar .btn{min-height:40px;padding:0 18px;font-size:13px}
@media (max-width:980px){.bar nav{display:none}}
@media (max-width:420px){.bar .id .lbl{display:none}}

/* seções */
section{padding-block:clamp(56px,8vw,104px)}
section + section{border-top:1px solid var(--linha)}
.sh{display:grid;grid-template-columns:72px minmax(0,1fr);gap:clamp(12px,3vw,32px);margin-bottom:clamp(28px,4vw,48px)}
.sh .n{font-family:var(--serif);font-size:15px;font-style:italic;padding-top:10px;color:var(--mata-2)}
.sh .n::after{content:"";display:block;width:100%;height:1.5px;background:var(--mata);margin-top:10px;transform-origin:left;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.sh h2{font-size:clamp(30px,4vw,48px)}
.sh p{margin-top:14px;max-width:60ch;opacity:.86}
@media (max-width:640px){.sh{grid-template-columns:minmax(0,1fr)}.sh .n{padding-top:0;width:64px}}
.body-col{margin-left:calc(72px + clamp(12px,3vw,32px))}
@media (max-width:640px){.body-col{margin-left:0}}

/* números-chave */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-block:1.5px solid var(--mata)}
.kpi{padding:22px clamp(12px,2vw,24px)}
.kpi + .kpi{border-left:1px solid var(--linha-forte)}
.kpi .v{font-family:var(--serif);font-size:clamp(30px,3.6vw,46px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-family:var(--sans);font-size:14px;font-weight:600;margin-left:4px}
.kpi .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-top:10px;opacity:.75}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--linha-forte)}}

/* diagnóstico */
.diag{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(24px,4vw,56px);align-items:start}
.diag .txt{font-family:var(--serif);font-size:clamp(19px,1.8vw,23px);line-height:1.55;min-width:0}
.diag .txt p + p{margin-top:16px}
.facts{background:var(--algodao);border-radius:18px;padding:8px 22px;min-width:0}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;font-size:14px}
.facts div + div{border-top:1px solid var(--linha)}
.facts dt{opacity:.7}
.facts dd{margin:0;font-weight:600;text-align:right}
@media (max-width:820px){.diag{grid-template-columns:minmax(0,1fr)}}

/* etapas */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.steps::before{content:"";position:absolute;left:0;right:0;top:21px;height:2px;background:var(--linha-forte)}
.steps::after{content:"";position:absolute;left:0;right:0;top:21px;height:2px;background:var(--mata);transform-origin:left;transform:scaleX(var(--p,1));transition:transform 1.6s cubic-bezier(.3,.6,.2,1)}
.steps li{position:relative;padding-right:18px}
.steps .dot{width:44px;height:44px;border-radius:50%;background:var(--orvalho);border:2px solid var(--mata);display:grid;place-items:center;font-family:var(--serif);font-size:16px;position:relative;z-index:1;transition:background .4s ease, color .4s ease}
.steps li.on .dot{background:var(--mata);color:var(--rebrota)}
.steps h3{font-size:20px;margin:18px 0 8px}
.steps p{font-size:14px;opacity:.82}
@media (max-width:860px){.steps{grid-template-columns:minmax(0,1fr);gap:22px}.steps::before,.steps::after{left:21px;right:auto;top:0;bottom:0;width:2px;height:auto}.steps::after{transform:scaleY(var(--p,1));transform-origin:top}.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:18px}.steps h3{margin-top:8px}.steps p{grid-column:2}}

/* especificação */
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-radius:18px;overflow:hidden;border:1px solid var(--linha-forte)}
.spec div{box-shadow:0 0 0 .5px var(--linha-forte);padding:22px;display:grid;gap:8px;align-content:start}
.spec .ic{width:40px;height:40px;border-radius:12px;background:var(--algodao);display:grid;place-items:center}
.spec h3{font-size:19px;margin-top:6px}
.spec p{font-size:14px;opacity:.86}
.spec .rate{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--mata-2)}
.norm{margin-top:18px;font-size:13px;opacity:.75;max-width:80ch}

/* pacotes */
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.pkg{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:12px;padding:26px 24px 24px;border-radius:20px;border:1.5px solid var(--linha-forte);background:var(--orvalho);transition:transform .25s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease}
.pkg:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(43,68,59,.12)}
.pkg:focus-visible{outline:2px solid var(--mata);outline-offset:3px}
.pkg .flag{position:absolute;top:-12px;left:22px;background:var(--rebrota);color:var(--mata);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pkg .nm{font-family:var(--serif);font-size:24px}
.pkg .rs{font-size:14px;opacity:.85;min-height:3.2em}
.pkg ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.pkg li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start}
.pkg li svg{width:18px;height:18px;margin-top:2px}
.pkg li.off{opacity:.38;text-decoration:line-through}
.pkg .pr{margin-top:auto;padding-top:14px;border-top:1px solid var(--linha)}
.pkg .pr b{display:block;font-family:var(--serif);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.pkg .pr span{font-size:12.5px;opacity:.7}
.pkg .radio{position:absolute;top:22px;right:22px;width:22px;height:22px;border-radius:50%;border:2px solid var(--linha-forte);transition:all .25s ease}
.pkg[aria-checked="true"]{background:var(--mata);color:var(--orvalho);border-color:var(--mata);box-shadow:0 22px 44px rgba(43,68,59,.25)}
.pkg[aria-checked="true"] .radio{border-color:var(--rebrota);background:var(--rebrota);box-shadow:inset 0 0 0 4px var(--mata)}
.pkg[aria-checked="true"] .pr{border-color:rgba(229,250,231,.2)}
@media (max-width:900px){.pkgs{grid-template-columns:minmax(0,1fr)}.pkg .rs{min-height:0}}

/* planilha */
.sheet{margin-top:clamp(28px,4vw,44px);background:var(--algodao);border-radius:20px;padding:clamp(18px,3vw,32px)}
.sheet-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sheet-h h3{font-size:22px}
.sheet-h span{font-size:13px;opacity:.7}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:left;font-weight:600;opacity:.7;padding:10px 10px;border-bottom:1.5px solid var(--mata)}
td{padding:14px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.i{opacity:.6;font-variant-numeric:tabular-nums;width:40px}
tr.row{transition:opacity .35s ease}
tr.row.out{opacity:.28}
tr.row.out td{text-decoration:line-through;text-decoration-color:rgba(43,68,59,.4)}
.total{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1.5px solid var(--mata)}
.total .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.total .lbl small{display:block;text-transform:none;letter-spacing:0;font-size:13px;margin-top:4px}
.total .big{font-family:var(--serif);font-size:clamp(36px,5vw,58px);line-height:1;font-variant-numeric:tabular-nums}
.total .m2{font-size:13px;opacity:.7;text-align:right;margin-top:6px}

/* cronograma */
.gantt{display:grid;gap:10px}
.g-row{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:16px;align-items:center}
.g-row .t{font-size:14px;font-weight:500}
.g-row .t small{display:block;font-weight:400;opacity:.65;font-size:12.5px}
.g-track{position:relative;height:30px;background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--linha) calc(10% - 1px) 10%);border-radius:8px}
.g-bar{position:absolute;top:4px;bottom:4px;border-radius:6px;background:var(--mata);transform-origin:left;transition:transform 1s cubic-bezier(.3,.6,.2,1)}
.g-bar.lime{background:var(--talude)}
.g-bar.lime2{background:var(--rebrota)}
.g-axis{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:16px;font-size:11.5px;opacity:.65}
.g-axis div:last-child{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
@media (max-width:600px){.g-row,.g-axis{grid-template-columns:minmax(0,1fr);gap:6px}.g-axis div:first-child{display:none}}

/* garantia */
.guar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;background:var(--mata);color:var(--orvalho);border-radius:24px;padding:clamp(24px,4vw,48px)}
.ring{width:clamp(170px,22vw,230px);aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c-bg{fill:none;stroke:rgba(229,250,231,.14);stroke-width:10}
.ring .c-fg{fill:none;stroke:var(--rebrota);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.8s cubic-bezier(.3,.6,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-family:var(--serif);font-size:clamp(44px,5vw,60px);font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.ring .lbl span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-top:6px}
.guar h3{font-size:clamp(24px,2.6vw,32px)}
.guar p{margin-top:12px;opacity:.88;max-width:58ch}
.guar ul{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;font-size:14.5px}
.guar li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px}
.guar li svg{width:20px;height:20px;margin-top:2px}
@media (max-width:720px){.guar{grid-template-columns:minmax(0,1fr)}}

/* condições */
.cond{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.cond > div{min-width:0}
.cond h3{font-size:20px;margin-bottom:12px}
.cond ul{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14.5px}
.cond li::marker{color:var(--talude)}
.cond .pay{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--linha-forte);border:1px solid var(--linha-forte);border-radius:18px;overflow:hidden}
.cond .pay div{background:var(--algodao);padding:20px 22px}
.cond .pay .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.cond .pay .v{font-family:var(--serif);font-size:19px;margin-top:6px;line-height:1.35}
@media (max-width:760px){.cond,.cond .pay{grid-template-columns:minmax(0,1fr)}}

/* portfólio */
.pf{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
.pf figure{margin:0;position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:var(--talude)}
.pf figure:first-child{aspect-ratio:auto}
.pf img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s ease}
.pf figure:hover img{transform:scale(1.04)}
.pf figcaption{position:absolute;left:12px;bottom:12px;right:12px;font-size:12.5px;color:var(--orvalho);background:rgba(31,51,44,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 12px;border-radius:10px}
@media (max-width:760px){.pf{grid-template-columns:1fr 1fr}.pf figure:first-child{grid-column:1/-1;aspect-ratio:16/10}}

/* aceite */
.accept{background:var(--mata);color:var(--orvalho);border-top:0}
.accept .grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,5vw,72px);align-items:start}
.accept h2{font-size:clamp(34px,4.6vw,58px)}
.accept h2 em{color:var(--rebrota)}
.accept .sum{margin-top:22px;font-size:15px;opacity:.9;max-width:52ch}
.accept .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.sign{background:rgba(229,250,231,.06);border:1px solid rgba(229,250,231,.16);border-radius:20px;padding:24px}
.sign .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;font-size:14px}
.sign .row + .row{border-top:1px solid rgba(229,250,231,.12)}
.sign .row span{opacity:.7}
.sign .row b{font-weight:600;text-align:right}
.sign .row b.tot{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--rebrota)}
.sig-lines{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px;font-size:12px;opacity:.8}
.sig-lines div{border-top:1px solid rgba(229,250,231,.4);padding-top:8px}
@media (max-width:820px){.accept .grid{grid-template-columns:minmax(0,1fr)}}
footer{background:var(--mata-3);color:var(--orvalho);font-size:12.5px;padding-block:22px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;opacity:.75}

/* revelação ao rolar: estado de repouso visível */
.js .rv.pre{opacity:0;transform:translateY(22px)}
.rv{transition:opacity .8s ease, transform .9s cubic-bezier(.2,.7,.2,1)}
.js .sh.pre .n::after{transform:scaleX(0)}

.err{max-width:560px;margin:80px auto;padding:0 16px;text-align:center}
.err h1{font-size:34px;margin-bottom:12px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

async function decode(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '=';
  const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(stream).text());
}

function merge(base, o){
  const out = Array.isArray(base) ? [] : {...base};
  for (const k in o){
    const v = o[k];
    out[k] = (v && typeof v === 'object' && !Array.isArray(v) && base && typeof base[k] === 'object' && !Array.isArray(base[k])) ? merge(base[k], v) : v;
  }

}

function countTo(el, to, fmt, ms=1100){

}

function shortDesc(d){ d = String(d||''); const cut = d.split(/,| com | nos | de equipe/)[0]; return cut.length > 4 ? cut : d; }

/* revelação ao rolar: só esconde o que está abaixo da dobra no carregamento */
function setupReveal(){
  const kpiDone = new WeakSet();
  const fire = el => {
    el.classList.remove('pre');
    el.querySelectorAll('[data-count]').forEach(c=>{
      if (kpiDone.has(c)) return; kpiDone.add(c);
      const to = Number(c.dataset.count), small = c.querySelector('small');
      const sfx = small ? small.outerHTML : '';
      const fmt = c.dataset.fmt==='m2' ? (v=>brl(v)) : (v=>Math.round(v).toLocaleString('pt-BR'));
      if (reduce){ c.innerHTML = fmt(to)+sfx; return; }
      const t0 = performance.now();
      const step = t => { const k=Math.min(1,(t-t0)/1300), e=1-Math.pow(1-k,3); c.innerHTML = fmt(to*e)+sfx; if(k<1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  };
  // valores finais já no estado de repouso
  document.querySelectorAll('[data-count]').forEach(c=>{
    const small = c.querySelector('small'), to = Number(c.dataset.count);
    c.innerHTML = (c.dataset.fmt==='m2'? brl(to) : Math.round(to).toLocaleString('pt-BR')) + (small?small.outerHTML:'');
  });
  const steps = $('#steps'), ring = $('#ring'), gantt = $('#gantt');
  if (reduce || !('IntersectionObserver' in window)){ steps?.querySelectorAll('li').forEach(l=>l.classList.add('on')); return; }

  const io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ fire(en.target); io.unobserve(en.target);} }),{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rv').forEach(el=>{
    const r = el.getBoundingClientRect();
    if (r.top > innerHeight){ el.classList.add('pre'); io.observe(el); }
    else if (el.querySelector('[data-count]')) { el.querySelectorAll('[data-count]').forEach(c=>c.innerHTML='0'+(c.querySelector('small')?.outerHTML||'')); fire(el); }
  });

  // linha das etapas
  if (steps && steps.getBoundingClientRect().top > innerHeight){
    steps.style.setProperty('--p',0);
    new IntersectionObserver((es,o)=>es.forEach(en=>{ if(en.isIntersecting){ o.disconnect(); steps.style.setProperty('--p',1);
      steps.querySelectorAll('li').forEach((l,i)=>setTimeout(()=>l.classList.add('on'), 250+i*300)); } }),{rootMargin:'0px 0px -20% 0px'}).observe(steps);
  } else steps?.querySelectorAll('li').forEach(l=>l.classList.add('on'));

  // anel de garantia
  if (ring && ring.getBoundingClientRect().top > innerHeight){
    const c = ring.querySelector('.c-fg'), target = c.getAttribute('stroke-dashoffset'), b = ring.querySelector('b'), pct = parseInt(b.textContent);
    c.style.strokeDashoffset = 100;
    new IntersectionObserver((es,o)=>es.forEach(en=>{ if(en.isIntersecting){ o.disconnect(); requestAnimationFrame(()=>{ c.style.strokeDashoffset = target; }); b.dataset.val=0; countTo(b,pct,v=>Math.round(v)+'%',1800); } }),{rootMargin:'0px 0px -15% 0px'}).observe(ring);
  }

  // barras do cronograma
  if (gantt && gantt.getBoundingClientRect().top > innerHeight){
    const bars = gantt.querySelectorAll('.g-bar'); bars.forEach(b=>b.style.transform='scaleX(0)');
    new IntersectionObserver((es,o)=>es.forEach(en=>{ if(en.isIntersecting){ o.disconnect(); bars.forEach((b,i)=>setTimeout(()=>b.style.transform='scaleX(1)', i*220)); } }),{rootMargin:'0px 0px -15% 0px'}).observe(gantt);
  }
}

/* ---------- capa: o jato de hidrossemeadura cobre o talude ---------- */
function spray(cv){
  if (!cv) return;
  const ctx = cv.getContext('2d');
  let W, H, dpr, slope, cover, blades, drops, acc=0, last=0, running=false;
  const BUCK = 160;
  function size(){
    dpr = Math.min(2, devicePixelRatio||1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    // perfil do talude: sobe da esquerda para a direita, com bermas
    slope = x => { const u = x/W; const base = H*(0.94 - 0.72*u); const berm = Math.sin(u*Math.PI*3)*H*0.03; return base + berm; };
  }
  function init(){
    size();
    cover = new Float32Array(BUCK); drops = []; acc = 0;
    blades = [];
    for (let i=0;i<Math.round(W/3.2);i++){
      const x = Math.random()*W;
      blades.push({x, h:8+Math.random()*22, lean:(Math.random()-.5)*.6, ph:Math.random()*6.28, c:Math.random()<.6?'#96F456':'#9AB06A', g:0});
    }
  }
  const ease = k => 1-Math.pow(1-k,3);
  function frame(now){
    if (!running) return;
    const dt = last ? Math.min(1/30,(now-last)/1000) : 1/60; last = now; acc += dt;
    const t = acc;
    ctx.clearRect(0,0,W,H);
    // terra
    ctx.beginPath(); ctx.moveTo(0,H);
    for (let x=0;x<=W;x+=8) ctx.lineTo(x, slope(x));
    ctx.lineTo(W,H); ctx.closePath();
    const g = ctx.createLinearGradient(0,H*.3,0,H);
    g.addColorStop(0,'#8B7350'); g.addColorStop(1,'#5f4e37');
    ctx.fillStyle = g; ctx.fill();
    // sulcos de erosão
    ctx.strokeStyle = 'rgba(31,51,44,.25)'; ctx.lineWidth = 1;
    for (let i=1;i<14;i++){ const x = W*i/14; ctx.beginPath(); ctx.moveTo(x, slope(x)+4); ctx.quadraticCurveTo(x-8, slope(x)+H*.12, x-4, H); ctx.stroke(); }

    // bico do jato varrendo o talude
    const SWEEP = 3.2;
    const k = Math.min(1, t/SWEEP);
    const tx = ease(k) * W * 1.04;
    const nozzle = {x: -20, y: H*0.62};
    if (k < 1){
      for (let i=0;i<9;i++){
        const aim = tx + (Math.random()-.5)*W*0.08;
        const ty = slope(Math.max(0,Math.min(W,aim)));
        const T = 0.6 + Math.random()*0.25; // tempo de voo
        drops.push({x:nozzle.x, y:nozzle.y, vx:(aim-nozzle.x)/T, vy:(ty-nozzle.y)/T - 0.5*900*T, life:0, T, r:1+Math.random()*2});
      }
    }
    ctx.fillStyle = 'rgba(150,244,86,.85)';
    for (let i=drops.length-1;i>=0;i--){
      const d = drops[i]; d.life += dt;
      const px = d.x + d.vx*d.life, py = d.y + d.vy*d.life + 0.5*900*d.life*d.life;
      if (d.life >= d.T || (d.life > .12 && py >= slope(Math.max(0,Math.min(W,px))))){
        const b = Math.floor(Math.max(0,Math.min(W-1,px))/W*BUCK);
        for (let j=-2;j<=2;j++){ const bb=b+j; if(bb>=0&&bb<BUCK) cover[bb] = Math.min(1, cover[bb] + 0.09/(1+Math.abs(j))); }
        drops.splice(i,1); continue;
      }
      ctx.globalAlpha = 0.5 + 0.5*Math.random(); ctx.beginPath(); ctx.arc(px,py,d.r,0,6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // camada de mulch verde onde caiu
    ctx.lineCap = 'round';
    for (let b=0;b<BUCK;b++){
      const c = cover[b]; if (c<=0) continue;
      const x0 = b/BUCK*W, x1 = (b+1)/BUCK*W;
      ctx.strokeStyle = `rgba(154,176,106,${0.35+0.6*c})`; ctx.lineWidth = 3 + 9*c;
      ctx.beginPath(); ctx.moveTo(x0, slope(x0)+ctx.lineWidth/2-1); ctx.lineTo(x1, slope(x1)+ctx.lineWidth/2-1); ctx.stroke();
    }
    // brotos crescem depois da cobertura
    for (const bl of blades){
      const b = Math.floor(bl.x/W*BUCK);
      if (cover[b] > .4) bl.g = Math.min(1, bl.g + 0.012);
      if (bl.g <= 0) continue;
      const y = slope(bl.x) + 2, h = bl.h*ease(bl.g);
      const sw = Math.sin(now/900 + bl.ph)*2.2*bl.g;
      ctx.strokeStyle = bl.c; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(bl.x, y); ctx.quadraticCurveTo(bl.x + bl.lean*h*.4, y - h*.6, bl.x + bl.lean*h + sw, y - h); ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  function still(){
    init(); cover.fill(1); blades.forEach(b=>b.g=1); acc = 99; running = true;
    requestAnimationFrame(n=>{ frame(n); running=false; });
  }
  if (reduce){ still(); addEventListener('resize', still); return; }
  init();
  // o jato começa quando o talude aparece e pausa quando a capa sai da tela
  const go = () => { if (running) return; running = true; last = 0; requestAnimationFrame(frame); };
  const check = () => { const r = cv.getBoundingClientRect(); const vis = r.top < innerHeight - 40 && r.bottom > 0; if (vis) go(); else running = false; };
  setTimeout(check, 450);
  addEventListener('scroll', check, {passive:true});
  let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ const c = cover; size(); cover = c; blades.forEach(b=>{ b.x = Math.random()*W; }); }, 150); });
}
